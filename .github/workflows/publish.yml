# Publication du paquet sur npmjs.com, à la fusion d'une pull request de version (distribution-du-paquet.md
# § Publication, ADR-010 révisée le 2026-11-19). La CI de chaque push et de chaque pull request reste ci.yml.
#
# Une pull request de version monte `version` de `packages/plateforme/package.json`, vers main ou vers
# `release/x.y.z` (correctif parti d'un tag). À sa fusion, le job `tag` rejoue les contrôles de contenu de la version
# (`scripts/ci/version-publiable.mjs`, que `ci.yml` joue déjà sur la pull request), vérifie qu'elle porte
# l'approbation d'un approbateur sur son dernier commit, puis pose le tag annoté `v<version>` sur le commit de
# fusion : un tag posé sur un commit qui ne peut pas être publié ne se retirerait qu'à la main. Le job
# `publish` part de ce tag, dans le même workflow : un tag poussé avec le GITHUB_TOKEN ne déclenche aucun autre
# workflow, d'où l'enchaînement ici plutôt qu'un `push: tags`.
#
# `workflow_dispatch` : passage manuel exceptionnel, sur un tag `v*` déjà posé (publication tombée après le tag,
# par exemple une panne de npm), lancé par un approbateur seulement. Pas de `push: tags` : quiconque peut pousser
# un tag publierait sans l'approbation exigée.
name: Publish package

on:
  pull_request:
    types: [closed]
    branches: [main, "release/**"]
    paths: ["packages/plateforme/package.json"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag v<version> déjà posé, à publier"
        required: true
        type: string

permissions:
  contents: read

# Une publication à la fois ; aucune n'en annule une autre.
concurrency:
  group: publish-package
  cancel-in-progress: false

env:
  # Les comptes GitHub dont l'approbation publie une version : JB, Alexis.
  APPROVERS: "jean-baptiste-tiple AlexisLaporte"
  # Le seul compte dont une fusion sans approbation publie quand même (contournement réservé à un blocage) : Alexis.
  BYPASSERS: "AlexisLaporte"

jobs:
  tag:
    name: Approval and tag of a version pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # pousser le tag
      pull-requests: read # lire les approbations
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Une pull request de version change `version` entre sa base (le point où elle part) et son dernier commit ;
      # changer une dépendance du paquet ne publie rien. Avant le tag : une seule migration depuis le tag précédent,
      # accord de la version et du CHANGELOG, tag encore libre.
      - name: Version change and content checks
        id: version
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR/head"
          node scripts/ci/version-publiable.mjs --ref "$MERGE_SHA" --base "$BASE_SHA" --head "$HEAD_SHA"
      # La dernière revue de chaque approbateur (hors simples commentaires) est une approbation, posée sur le dernier
      # commit de la pull request : une approbation antérieure à un push ne couvre pas ce qui est publié.
      # Contournement : Alexis (`BYPASSERS`) qui fusionne sans approbation (exception des administrateurs de la règle
      # de branche, réservée à un blocage) publie quand même ; le job le dit en avertissement et dans son résumé.
      # Toute autre fusion sans approbation échoue, et rien n'est tagué : JB, même administrateur, attend Alexis.
      - name: Approved by an approver, or merged by a bypasser
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | [.user.login, .state, .commit_id] | @tsv' > reviews.tsv
          approved=""
          for login in $APPROVERS; do
            last=$(awk -F'\t' -v who="$login" '$1 == who && $2 != "COMMENTED" { state = $2; commit = $3 } END { print state " " commit }' reviews.tsv)
            if [ "$last" = "APPROVED $HEAD_SHA" ]; then approved="$login"; break; fi
          done
          if [ -n "$approved" ]; then echo "approved by $approved"; exit 0; fi
          for login in $BYPASSERS; do
            if [ "$MERGED_BY" = "$login" ]; then
              message="published WITHOUT approval: pull request #$PR merged by $MERGED_BY, who bypassed the review; the reason is due as a comment on the pull request"
              echo "::warning title=Version without approval::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "no approval by one of: $APPROVERS, on $HEAD_SHA, and merged by $MERGED_BY, not one of: $BYPASSERS"; exit 1
      - name: Tag the merge commit
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "@otomata_tech/oto_platform ${TAG#v}" "$MERGE_SHA"
          git push origin "refs/tags/$TAG"

  publish:
    name: Publish from the tag
    needs: tag
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.tag.result == 'success' && needs.tag.outputs.tag != '') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance npm
    env:
      TAG: ${{ needs.tag.outputs.tag || inputs.tag }}
    steps:
      - name: Manual pass by an approver only
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a v<version> tag: $TAG"; exit 1 ;; esac
          for login in $APPROVERS; do test "$GITHUB_ACTOR" = "$login" && exit 0; done
          echo "$GITHUB_ACTOR is not one of: $APPROVERS"; exit 1
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # check-public lit tout l'historique
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secrets (tree and history)
        run: node scripts/check-public.mjs --secrets-only
      - name: Check migrations
        run: pnpm check:migrations
      # Une seule migration par version publiée (database-patterns.md § Règles) : un hôte en applique une par montée.
      # Accord du tag, de la version et du CHANGELOG. Déjà joués avant le tag ; rejoués ici pour le passage manuel.
      - name: One migration since the previous tag; tag, version and CHANGELOG agree
        run: node scripts/ci/version-publiable.mjs --ref "$TAG" --tag "$TAG"
      - name: Files to publish
        working-directory: packages/plateforme
        run: npm pack --dry-run
      - name: Publish
        working-directory: packages/plateforme
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
