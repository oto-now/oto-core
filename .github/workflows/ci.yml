# CI — contrôle des migrations et build
# Type-check, lint et tests restent en local via commit-push ; la CI relit le reçu de chaque commit (`recu`), lance `check:migrations`
# (FR-INST-04) puis `build`, le build d'un hôte qui installe le paquet empaqueté (`packed-host-build`), et
# prouve la portabilité du schéma (E01-S09) : la ligne de base s'installe
# sur un Postgres sans Supabase (`bare-postgres`). La ligne de base V1 égale l'ancienne chaîne : comparaison
# jouée une fois, hors de la CI (E01-S12 partie d ; un dépôt neuf n'a pas l'historique de la chaîne, D96).
name: CI — Build

on:
  push:
    # `release/**` : une version corrective partie d'un tag (`release/1.4.1` depuis `v1.4.0`), quand main porte un lot pas encore
    # publiable ; son tag ne part que d'un commit où ces jobs sont verts, comme sur main.
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations
        run: pnpm check:migrations

      - name: Build
        run: pnpm build

  # Le build ci-dessus lit le paquet par le lien du workspace ; un hôte l'installe depuis son archive, où
  # son bundler applique `"sideEffects": false` et peut ouvrir une face par n'importe quel module. Ce job
  # construit l'application de référence hors du dépôt, le paquet installé depuis `pnpm pack`
  # (`deployment-patterns.md § Build comme un hôte`).
  packed-host-build:
    name: Build as a host (packed package)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack, install in a copy of the reference host, next build
        run: node scripts/ci/packed-host-build.mjs

  # Le reçu de chaque commit poussé (`scripts/ci/recu.mjs`, #84) : son `Verified-tree:`, posé par `pnpm commit:export`
  # après un `pnpm verify` complet, égale son arbre de code ; ou son arbre de code est celui de son parent (documents
  # de méthode seuls). Sans installation : git et node suffisent. Le SHA de départ et d'arrivée passe par `env`.
  recu:
    name: Receipt (Verified-tree of each pushed commit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--avertir` jusqu'au 29/10/2026 (#85) : le retirer rend le job bloquant.
      - name: Receipt of each commit
        env:
          DEPUIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          JUSQUA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/recu.mjs --depuis "$DEPUIS" --jusqua "$JUSQUA" --avertir

  # AC10, AC12, AC13 : sur un postgres:16 vierge (sa distribution porte moddatetime, que le Postgres
  # managé de Scaleway refuse), `db prepare` deux fois, la ligne de base par la CLI Supabase, puis la
  # fumée : ni moddatetime ni auth.users, et Léa ne lit que les nœuds de son organisation. Puis
  # (E01-S10, AC-a7, AC-f5) toute la suite Vitest, tests unitaires compris, sans aucune variable
  # Supabase : les suites portables passent sur ce Postgres nu, celles de Supabase se sautent. Le job
  # joint un Postgres jetable sans mot de passe (`trust`) : une URL qui en porte un, le contrôle
  # pré-public la refuse ; et sans TLS (`sslmode=disable`), que la CLI du paquet exige sinon.
  bare-postgres:
    name: Bare Postgres (db prepare, baseline, isolation)
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres@localhost:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # La première par PLATFORM_ADMIN_DATABASE_URL, la seconde par --db-url sans mot de passe : les deux
      # adresses que la CLI admet (`cli/admin-url.mjs`).
      - name: db prepare, twice; the second changes nothing
        run: |
          set -o pipefail
          export PLATFORM_APP_PASSWORD="$(openssl rand -hex 16)"
          PLATFORM_ADMIN_DATABASE_URL="$DB_URL" node packages/plateforme/cli/bin.mjs db prepare
          node packages/plateforme/cli/bin.mjs db prepare --db-url "$DB_URL" | tee "$RUNNER_TEMP/second.txt"
          if grep -E ': (créée?|accordé)' "$RUNNER_TEMP/second.txt"; then exit 1; fi

      # La CLI Supabase ignore `sslmode=disable` dans `--db-url` et refuse un Postgres sans TLS ;
      # `PGSSLMODE` l'y fait passer (rejeu local du 2026-09-27, CLI 2.108).
      - name: Baseline by the Supabase CLI
        env:
          PGSSLMODE: disable
        run: supabase db push --db-url "$DB_URL" --yes

      - name: Smoke
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 < scripts/ci/bare-postgres-smoke.sql

      # Le serveur importe le bundle du widget, généré et jamais commité (`mcp/widget-meta.ts`).
      - name: Widget bundle
        run: pnpm widgets:build

      # Le serveur par `platform_app`, l'administration des tests par `postgres` ; tous deux sans mot de
      # passe (`trust`), sur la machine du job : le pool du paquet s'y passe de TLS.
      - name: Portable tests
        env:
          PLATFORM_DATABASE_URL: postgresql://platform_app@localhost:5432/postgres
          PLATFORM_ADMIN_DATABASE_URL: ${{ env.DB_URL }}
        run: pnpm exec vitest run tests/integration tests/unit
